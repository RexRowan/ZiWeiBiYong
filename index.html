*,*::before,*::after{box-sizing:border-box}
html{background:var(--xuan)}
body{margin:0;background:var(--xuan);color:var(--bo);font:400 1.0625rem/1.9 var(--f-body);-webkit-font-smoothing:antialiased}
a{color:inherit}
::selection{background:var(--zhu);color:var(--bo)}
:focus-visible{outline:2px solid var(--jin);outline-offset:3px}
.wrap{max-width:1000px;margin-inline:auto;padding-inline:16px}

/* 頂欄與導覽 */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:rgba(17,17,17,.97);border-bottom:1px solid var(--jin-line)}
.bar{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:.25rem 1rem;min-height:56px}
.brand{display:block;color:var(--jin);text-decoration:none}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.seal{display:flex;flex-direction:row-reverse;align-items:center;justify-content:center}
.seal svg{display:block;width:auto;max-width:none;color:var(--jin)}
.brand .seal{gap:.25rem}
.brand .seal svg{height:34px}
.seal-title{margin:.9rem 0 0;font-size:1rem;line-height:0}
.plaque .seal{gap:clamp(.7rem,3.2vw,1.9rem)}
.plaque .seal svg{height:clamp(4.6rem,17vw,7rem);filter:drop-shadow(0 2px 0 #000)}
.menu-btn{font:500 .875rem var(--f-ui);letter-spacing:.2em;color:var(--bo);background:transparent;border:1px solid var(--jin-line);padding:.4rem 1rem;cursor:pointer}
.menu-btn:hover{border-color:var(--jin)}
#nav ul{list-style:none;margin:0;padding:0}
.tl{display:block;font:500 .9375rem var(--f-ui);letter-spacing:.25em;color:var(--bo);background:transparent;border:0;border-bottom:3px solid transparent;padding:.95rem .9rem .8rem;text-decoration:none;cursor:pointer}
.tl:hover{color:var(--jin)}
#nav li.on>.tl,#nav li.open>.tl{border-bottom-color:var(--zhu);color:var(--jin)}
.mega{display:none}
li.open>.mega{display:block}
.mega-in{max-width:1000px;margin:0 auto;padding:1.25rem 16px 1.5rem;display:grid;grid-template-columns:repeat(auto-fit,minmax(9.5rem,1fr));gap:1.25rem 1.75rem}
.col{min-width:0}
.col.wide{grid-column:span 2}
.col h3{font:500 .75rem var(--f-ui);letter-spacing:.3em;color:var(--jin);border-bottom:1px solid var(--jin-line);padding-bottom:.35rem;margin:0 0 .65rem}
.links{display:flex;flex-wrap:wrap;gap:.2rem 1rem;margin-bottom:.4rem}
.col a{font-size:1rem;line-height:1.7;color:var(--bo);text-decoration:none;border-bottom:1px solid transparent}
.col a:hover,.col a[aria-current]{color:var(--jin);border-bottom-color:var(--zhu)}
.sub{display:flex;gap:.9rem;align-items:baseline;flex-wrap:wrap;margin-bottom:.1rem}
.sh{font:400 .8125rem var(--f-ui);letter-spacing:.15em;color:var(--bo-dim);min-width:3.2em}
@media (min-width:821px){
  .menu-btn{display:none}
  #nav ul{display:flex;gap:.15rem}
  .mega{position:absolute;left:0;right:0;top:100%;background:var(--xuan-2);border-bottom:1px solid var(--jin);box-shadow:0 20px 32px rgba(0,0,0,.55)}
}
@media (max-width:820px){
  #nav{display:none;flex-basis:100%;max-height:calc(100vh - 64px);max-height:calc(100dvh - 64px);overflow-y:auto;padding-bottom:1rem}
  #nav.open{display:block}
  .tl{width:100%;text-align:left;border-bottom:1px solid var(--jin-faint);padding-inline:0}
  #nav li.on>.tl,#nav li.open>.tl{border-bottom-color:var(--zhu)}
  .mega-in{padding:1rem 0 .5rem}
  .col.wide{grid-column:auto}
}

/* 兩側中軸 */
.axis{display:none}
@media (min-width:1280px){
  .axis{display:block;position:fixed;top:0;bottom:0;width:72px;z-index:0;pointer-events:none;opacity:.6}
  .axis::before{content:"";position:absolute;inset:0;background:var(--meander) repeat-y center top/48px 48px;-webkit-mask-image:linear-gradient(transparent,#000 14%,#000 86%,transparent);mask-image:linear-gradient(transparent,#000 14%,#000 86%,transparent);opacity:.7}
  .axis.l{left:calc(50% - 500px - 124px)}
  .axis.r{right:calc(50% - 500px - 124px)}
  .medal{position:absolute;left:0;top:24vh;width:72px;filter:drop-shadow(0 0 6px #111) drop-shadow(0 0 10px #111)}
}
.totem{display:block;aspect-ratio:420/412;background:var(--totem) center/contain no-repeat}
.plaque .totem{width:clamp(5.5rem,22vw,8.5rem);margin:0 auto 1.1rem;opacity:.92}

/* 主體 */
main{position:relative;z-index:1;padding-bottom:4rem;min-height:62vh}
.page{max-width:44rem;margin-inline:auto}
.plaque{position:relative;margin:2.75rem 8px 2.25rem;padding:clamp(1.75rem,6vw,3.5rem) 1rem;border:1px solid var(--jin);outline:1px solid var(--jin-line);outline-offset:6px;background:linear-gradient(var(--xuan-2),var(--xuan));text-align:center}
.kicker{margin:0;padding-left:.5em;font:400 .8125rem var(--f-ui);letter-spacing:.5em;color:var(--bo-dim)}
.rule{display:block;width:3.2rem;height:3px;margin:1.4rem auto 1.1rem;background:var(--zhu)}
.motto{margin:0;padding-left:.35em;font-size:1.2rem;letter-spacing:.35em;color:var(--bo)}
.intro{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:1.25rem 2rem;max-width:44rem;margin:0 auto 3rem}
.intro p{margin:0;flex:1 1 18rem}
.btn{display:inline-block;font:500 .9375rem var(--f-ui);letter-spacing:.3em;padding:.7rem 1.6rem .7rem 1.9rem;color:var(--bo);background:var(--zhu);border:1px solid var(--zhu);text-decoration:none}
.btn:hover{border-color:var(--jin)}
.sec{font:500 .8125rem var(--f-ui);letter-spacing:.4em;color:var(--jin);display:flex;align-items:center;gap:1rem;margin:0 0 1rem}
.sec::after{content:"";flex:1;height:1px;background:var(--jin-line)}
.recent{max-width:44rem;margin:0 auto}
.row{display:grid;grid-template-columns:1fr auto;gap:.1rem 1rem;align-items:baseline;padding:.9rem 0;border-bottom:1px solid var(--jin-faint);text-decoration:none}
.row:hover .rt{color:var(--jin)}
.rt{font-size:1.15rem;font-weight:600}
.rb,.rc{font:400 .8125rem var(--f-ui);color:var(--bo-dim);letter-spacing:.08em}
.rc{text-align:right}
.note{margin:1rem 0 0;font:400 .8125rem/1.7 var(--f-ui);color:var(--bo-dim)}
.tag{display:inline-block;font:500 .6875rem/1.6 var(--f-ui);letter-spacing:.2em;padding:0 .55rem 0 .7rem;background:var(--zhu);color:var(--bo);vertical-align:.1em;margin-left:.4rem}

/* 欄目頁 */
.manifesto p{margin:0 0 1.2em;font-size:1.125rem;line-height:2.1;letter-spacing:.04em}
.coda{margin-top:2.75rem;padding-top:2.25rem;border-top:1px solid var(--jin-line);text-align:center}
.coda p{margin:0 0 .5em;padding-left:.4em;letter-spacing:.3em}
.coda p:last-of-type{margin-top:1.1rem;font-family:var(--f-seal);font-weight:900;font-size:1.9rem;color:var(--jin);letter-spacing:.45em;padding-left:.45em}
.coda p:last-of-type::before{content:"";display:block;width:3rem;height:3px;margin:0 auto 1.1rem;background:var(--zhu)}
.coda .totem{width:56px;margin:2rem auto 0;opacity:.5}
.crumbs{display:flex;flex-wrap:wrap;align-items:center;gap:.2rem .6rem;margin:2.25rem 0 1.25rem;font:400 .8125rem var(--f-ui);letter-spacing:.12em;color:var(--bo-dim)}
.crumbs i{font-style:normal;color:var(--jin-line)}
.crumbs a{text-decoration:none}
.crumbs a:hover{color:var(--jin)}
.crumbs [aria-current]{color:var(--jin)}
h2.ph{margin:0 0 1.5rem;font-family:var(--f-seal);font-weight:900;font-size:clamp(2.2rem,8vw,3.4rem);line-height:1.2;letter-spacing:.25em;color:var(--jin)}
.dfn{margin:0 0 2.5rem;padding:1.1rem 1.25rem 1.2rem;border:1px solid var(--jin-line)}
.dfn b{display:inline-block;font:500 .75rem var(--f-ui);letter-spacing:.35em;color:var(--jin);margin-bottom:.35rem}
.dfn p{margin:0}
.entry{padding:1.9rem 0 2rem;border-top:1px solid var(--jin-line)}
.entry h3{margin:0;font-size:1.4rem;font-weight:600;letter-spacing:.08em}
.by{margin:.2rem 0 1.25rem;font:400 .8125rem var(--f-ui);letter-spacing:.1em;color:var(--bo-dim)}
.verse-wrap{overflow-x:auto;padding-block:.25rem}
.verse{font-size:1.2rem;line-height:2.1;letter-spacing:.12em}
.verse p{margin:0}
.verse p.gap{height:1em}
.verse.v p.gap{height:auto;width:1em}
.verse.ci{font-size:1.125rem;line-height:2;letter-spacing:.06em}
.verse.ci p{margin-block-end:.7em}
.prose{font-size:1.0625rem;line-height:2.05}
.prose p{margin:0 0 1.1em;text-indent:2em;text-align:justify}
.entry.pre h3{font-size:1.1rem;color:var(--jin);letter-spacing:.2em}
.entry.pre .prose{font-size:1rem;color:var(--bo-dim)}
.prose p.zhu{text-indent:0;margin-top:-.5em;padding-left:1rem;border-left:2px solid var(--zhu);font-size:.9375rem;line-height:1.9;color:var(--bo-dim)}
.xu{margin:1rem 0 0;font-size:.9375rem;line-height:1.8;color:var(--bo-dim)}
.xu b{display:inline-block;margin-right:.9em;font:500 .6875rem var(--f-ui);letter-spacing:.3em;color:var(--jin)}
.entry{scroll-margin-top:72px}
.toc{margin:0 0 2.25rem;padding:1rem 1.25rem 1.1rem;border:1px solid var(--jin-faint)}
.toc b{display:block;font:500 .75rem var(--f-ui);letter-spacing:.35em;color:var(--jin);margin-bottom:.6rem}
.toc .links{gap:.35rem .5rem;margin:0}
.toc button{font:inherit;font-size:.9375rem;color:var(--bo);background:transparent;border:1px solid var(--jin-line);padding:.15rem .7rem;cursor:pointer}
.toc button:hover{border-color:var(--jin);color:var(--jin)}
.verse.v{writing-mode:vertical-rl;text-orientation:mixed;height:17.5em;padding-inline:.5rem;margin-inline:auto;width:max-content}
.vtoggle{margin-top:1rem;font:400 .8125rem var(--f-ui);letter-spacing:.25em;color:var(--bo);background:transparent;border:1px solid var(--jin-line);padding:.3rem .9rem .3rem 1.1rem;cursor:pointer}
.vtoggle:hover{border-color:var(--jin);color:var(--jin)}
.empty{display:flex;flex-direction:column;align-items:center;gap:.6rem;padding:2.5rem 1rem;border:1px dashed var(--jin-line);text-align:center;color:var(--bo-dim)}
.empty .totem{width:64px;opacity:.45}
.empty p{margin:0}
.empty .e1{font-size:1.15rem;letter-spacing:.4em;padding-left:.4em;color:var(--bo)}
.empty .e2{font:400 .8125rem var(--f-ui);letter-spacing:.1em}
.pager{display:flex;justify-content:space-between;gap:1rem;margin-top:3rem;padding-top:1.25rem;border-top:1px solid var(--jin-line)}
.pager a{display:flex;flex-direction:column;gap:.1rem;text-decoration:none;font-size:1.15rem;letter-spacing:.15em}
.pager a.nx{text-align:right;margin-left:auto}
.pager small{font:400 .75rem var(--f-ui);letter-spacing:.3em;color:var(--bo-dim)}
.pager a:hover{color:var(--jin)}

/* 俯瞰 */
.ov{margin:0 0 3rem}
.ovh{margin:0 0 1.25rem;font-family:var(--f-seal);font-weight:900;font-size:2rem;letter-spacing:.3em;color:var(--jin)}
.ovg{margin:0 0 1.4rem}
.ovg h3{display:flex;align-items:center;gap:.8rem;margin:0 0 .7rem;font:500 .8125rem var(--f-ui);letter-spacing:.3em;color:var(--bo-dim)}
.ovg h3::after{content:"";flex:1;height:1px;background:var(--jin-faint)}
.ovg .ovg{margin-left:1.25rem}
.ovlinks{display:flex;flex-wrap:wrap;gap:.5rem;margin-bottom:.6rem}
.ovl{display:inline-flex;align-items:baseline;gap:.7rem;padding:.35rem .85rem .4rem;border:1px solid var(--jin-line);text-decoration:none}
.ovl:hover{border-color:var(--jin);color:var(--jin)}
.ovl i{font:400 .6875rem var(--f-ui);font-style:normal;letter-spacing:.1em;color:var(--bo-dim)}

.foot{position:relative;z-index:1;margin-top:1rem;padding-block:0 3rem;text-align:center;color:var(--bo-dim)}
.band{height:24px;margin-bottom:1.75rem;background:var(--meander) repeat-x center/24px 24px;opacity:.35}
.foot .totem{width:46px;margin:0 auto;opacity:.5}
.foot p{margin:.4rem 0 0;font:400 .8125rem var(--f-ui);letter-spacing:.35em;padding-left:.35em}
@media (max-width:520px){
  .row{grid-template-columns:1fr}
  .rc{text-align:left}
  .ovg .ovg{margin-left:.5rem}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}

 "lun": [

   "title": "斥巧術逐末論",
   "by": "論",
   "form": "prose",
   "paras": [
    "天地並育，人異禽獸者，非徒求食息也，蓋能明道知義，知恥不為，知難必為。故技濟生，學明理，禮正行，文存心，四者相資，不可偏廢。",
    "今百工競巧，機械代人力，算術窮繁數，旬月成昔人百年之功。所憂者，非器之精，乃心之狹；非術之昌，乃以術兼斷大道也。",
    "夫算術察物，技藝制器，明因果、計得失，使人知何以成事，此其用也。然天下尚有一問，非刻石算式所能決，非器械所能答，曰：「此事雖能，果當為乎？」",
    "能造器，未必知所用；能聚財，未必知財之善；能延年，未必知生之貴；能連萬邦，未必通人心。故知能不能者，巧術也；問當不當者，大道也。",
    "世俗逐利，工商興則百姓有業，醫藥進則疾疫有療，此實利也，不可輕。所惡者，以可計者括不可計之物，以功利獨斷萬事是非。財可計，不可計友；功可計，不可計格；壽可計，不可計貴。若以功利論一切，則人自視為器，身亦可淘。此非器之罪，乃尺度僭越之罪也。刀能殺人亦能救人，物本無德，患在以一器之長，謂萬物皆當如器。",

    "好古之士，誦詩書不知民生，談禮樂不問事實，此亦逐末也。巧術之末，只問能否；虛文之末，只問雅否。一將人變為工具，一將人變為典飾。真文敢受事實，真術知其邊界。術糾人之幻，文糾人之慢，相為用也。",

    "維濟水之伏流，出王屋而潛行。歷千里而莫見，至歷下而始明。爰有濼源，實為其竇。三窟並涌，一泓獨秀。其始也，如珠串之徐升；其盛也，如雪浪之驟驟。聲則隱隱若雷，勢則滾滾如輪。",

    "術數者，古之推天測地、察命觀變之學也。其名始見於《漢書·藝文志》，列天文、曆譜、五行、蓍龜、雜佔、形法六種。然其源更早，蓋自上古觀象授時始。伏羲畫卦，大撓作甲子，容成造曆，皆術數之濫觴也。",

    "術數之要，在於天人合一。天有陰陽，地有剛柔，人有仁義。天有五行，地有五方，人有五臟。古人以為，天地一大宇宙，人身一小宇宙，大小雖殊，其理則一。故術數之家，以干支紀時，以五行分類，以八卦定象。其法也，以簡御繁，以虛御實。譬如八字，僅八字可推一生；譬如六爻，僅六爻而可斷一事。此非術數之能，乃術數所本之理能也。",

    "故吾之說術數也，不重其術而重其理，不尚其奇而尚其通。術數者，天地間之尺也。量天量地量人，量古量今量未來。尺有長短，有精粗，有正誤，然不可無尺。無尺則長短不分，古今不辨，天人相隔。學者當以道觀術，以理出數，以智用佔。如此，則術數為我用，而非我為術數所用矣。",

  "by": "跋",
  "form": "prose",
  "paras": [
   "兹志怪四篇。",
   "始於水天，終於忘魔。其間有鴉有鯉，有犬有狼，有張有鬼，有清有濁。其事或荒忽，其言或鄙俚，然皆有所寄。",
   "水天篇，寄於情。情之至者，可以穿冰，可以越界，可以死而復生。烏鴉啄冰，鯉魚撞擊冰，非啄冰也，啄類與類之間之牆也。牆穿，而後鳳與龍生。故鳳與龍者，非鳥非魚，非精非怪，乃情之形也。",
   "變狼，寄於怨。怨之極者，可以化性，可以噬主。犬本馴，棄之深山，飢寒交迫，搏獸而食，遂得狼性。及其歸也，主猶以犬待之。犬已非犬，主猶以舊目視之。故噬之者，非犬也，非狼也，乃怨之形也。",
   "換命，寄於疑。疑之深者，可以反覆，可以自滅。張棄生為鬼，鬼取生為人。張見鬼之成，乃悔。訟於天，天不許。張之反覆，非天不容，張自不容也。故銷其魂者，非天也，乃疑之形也。",
   "忘魔，寄於空。空之極者，可以守，可以破，可以散。清守天條千年，濁破天千千年，皆不快活。何也？守與破，皆非生也。故清散其魂，濁先散之。二人同歸於空，而後同入輪迴。故村中兄弟者，非清非濁，乃空之形也。",
   "四篇之中，有隱線一：鳳與龍。",
   "水天篇末，鳳與龍生，飛上九天。自此，每一篇中，天上有鳳與龍緩緩飛過。變狼篇中，犬仰首見之，不識。換命篇中，張魂銷時，鳳與龍正過其頂。忘魔篇末，村中兄弟仰首見之，而後畫水天二字於地。",
   "鳳與龍，始終在飛。始終在尋。始終在等。",
   "尋什麼？尋一塊冰。冰下有一條魚在聽。",
   "等什麼？等冰化。",
   "冰化了嗎？",
   "沒有。",
   "故志怪四篇終，而冰未化。鳳與龍猶飛。篤、篤、篤。",
   "是為跋。"

  }

    nodes.forEach(function (n) {

    });
  })(TREE, []);

  function esc(s) {
    return String(s).replace(/[&<>"]/g, function (c) {

    });
  }

    var out = '', run = '';
    function flush() { if (run) { out += '<div class="links">' + run + '</div>'; run = ''; } }
    kids.forEach(function (k) {
      if (k.kids) {
        flush();
        out += '<div class="sub"><span class="sh">' + k.t + '</span><div class="links">' + k.kids.map(linkHTML).join('') + '</div></div>';
      } else run += linkHTML(k);
    });
    flush();
    return out;
  }
  function megaHTML(node) {
    var cols = [], run = [];
    node.kids.forEach(function (k) {
      if (k.kids) {
        if (run.length) { cols.push({ leaves: run }); run = []; }
        cols.push({ node: k });
      } else run.push(k);
    });
    if (run.length) cols.push({ leaves: run });
    return '<div class="mega-in">' + cols.map(function (c) {
      if (c.leaves) return '<div class="col"><div class="links">' + c.leaves.map(linkHTML).join('') + '</div></div>';
      var wide = c.node.kids.some(function (k) { return k.kids; }) ? ' wide' : '';

  "一器可食其力，一藝可成其名，然非吾所願也。",
  "吾願讀百家之書，觀山川之形，察草木之理，究器物之用；上窮天文，下察地理，中觀人事。經史子集，東西古今，皆可為師。得一理，則求其所通；見一事，則察其所由。",
  "故不貴一技之名，而貴萬物之理。",
  "數可窮微，藝可窮神，史可鑑變，文可觀心。此四科不同，故能之者偏也；唯通才，能備其體。學雖分途，道未嘗異。譬諸江海，百川殊流，而同歸一源。",

  function jianjieHTML() {
    var n = INTRO.paras.length, body = INTRO.paras.slice(0, n - 2), coda = INTRO.paras.slice(n - 2);
    return '<div class="page"><div class="crumbs"><a href="#home">主頁</a><i>›</i><span aria-current="page">簡介</span></div>' +
      '<h2 class="ph">' + esc(INTRO.title) + '</h2>' +
      '<div class="manifesto">' + body.map(function (l) { return '<p>' + esc(l) + '</p>'; }).join('') +
      '<div class="coda">' + coda.map(function (l) { return '<p>' + esc(l) + '</p>'; }).join('') + BIRD + '</div></div></div>';
  }

  function norm(id) {
    return (id === 'home' || id === 'jianjie' || id === 'mulu' || (byId[id] && INFO[id])) ? id : 'home';
  }
  function render(id, scroll) {
    id = norm(id);
    current = id;
    view.innerHTML = id === 'home' ? homeHTML()
      : id === 'mulu' ? muluHTML()
      : id === 'jianjie' ? jianjieHTML()
      : leafHTML(byId[id]);
    markActive(id);
    closeAll();
    if (scroll) window.scrollTo(0, 0);
  }
  function go(id) {
    try { if (location.hash !== '#' + id) location.hash = id; } catch (e) { /* 忽略 */ }
    render(id, true);
  }

  /* ───── 事件 ───── */
  document.addEventListener('click', function (e) {
    var t = e.target;
    if (!t.closest) return;
    var a = t.closest('a[href^="#"]');
    if (a) { e.preventDefault(); go(a.getAttribute('href').slice(1)); return; }
    var tl = t.closest('button.tl');
    if (tl) {
      var li = tl.parentNode, was = li.classList.contains('open');
      closeMenus();
      if (!was) { li.classList.add('open'); tl.setAttribute('aria-expanded', 'true'); }
      return;
    }
    var gt = t.closest('[data-goto]');
    if (gt) { var tg = document.getElementById(gt.getAttribute('data-goto')); if (tg) tg.scrollIntoView({ block: 'start' }); return; }
    var vt = t.closest('.vtoggle');
    if (vt) {
      var verse = vt.parentNode.querySelector('.verse');
      var on = verse.classList.toggle('v');
      vt.setAttribute('aria-pressed', on ? 'true' : 'false');
      vt.textContent = on ? '橫排' : '直排';
      return;
    }
    if (t.closest('#menuBtn')) {
      var open = nav.classList.toggle('open');
      menuBtn.setAttribute('aria-expanded', open ? 'true' : 'false');
      return;
    }
    if (!t.closest('#nav')) closeMenus();
  });
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape') closeAll(); });
  window.addEventListener('hashchange', function () {
    var id = norm((location.hash || '#home').slice(1));
    if (id !== current) render(id, true);
  });

  render((location.hash || '#home').slice(1), false);
})();
</script>
